<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
<rect width="800" height="450" fill="#0b080c"/>
<text x="400" y="40" text-anchor="middle" fill="#c2a4ff" font-family="Arial" font-size="22" font-weight="bold">AWS 3-Tier Web Architecture</text>

<rect x="60" y="70" width="680" height="340" rx="10" fill="none" stroke="#ff9900" stroke-width="2" stroke-dasharray="6,4"/>
<text x="80" y="95" fill="#ff9900" font-family="Arial" font-size="13">VPC</text>

<rect x="330" y="110" width="140" height="60" rx="8" fill="#161217" stroke="#eae5ec" stroke-width="1.5"/>
<text x="400" y="145" text-anchor="middle" fill="#eae5ec" font-family="Arial" font-size="14">Route 53</text>

<rect x="330" y="190" width="140" height="60" rx="8" fill="#161217" stroke="#eae5ec" stroke-width="1.5"/>
<text x="400" y="215" text-anchor="middle" fill="#eae5ec" font-family="Arial" font-size="13">Elastic Load</text>
<text x="400" y="235" text-anchor="middle" fill="#eae5ec" font-family="Arial" font-size="13">Balancer</text>

<rect x="120" y="280" width="150" height="70" rx="8" fill="#1e1824" stroke="#c2a4ff" stroke-width="1.5"/>
<text x="195" y="308" text-anchor="middle" fill="#eae5ec" font-family="Arial" font-size="13">Web Tier</text>
<text x="195" y="328" text-anchor="middle" fill="#a8a2ad" font-family="Arial" font-size="11">EC2 Auto Scaling</text>

<rect x="330" y="280" width="150" height="70" rx="8" fill="#1e1824" stroke="#c2a4ff" stroke-width="1.5"/>
<text x="405" y="308" text-anchor="middle" fill="#eae5ec" font-family="Arial" font-size="13">App Tier</text>
<text x="405" y="328" text-anchor="middle" fill="#a8a2ad" font-family="Arial" font-size="11">EC2 Auto Scaling</text>

<rect x="540" y="280" width="150" height="70" rx="8" fill="#1e1824" stroke="#ff9900" stroke-width="1.5"/>
<text x="615" y="308" text-anchor="middle" fill="#eae5ec" font-family="Arial" font-size="13">DB Tier</text>
<text x="615" y="328" text-anchor="middle" fill="#a8a2ad" font-family="Arial" font-size="11">RDS (Multi-AZ)</text>

<line x1="400" y1="170" x2="400" y2="190" stroke="#eae5ec" stroke-width="2"/>
<line x1="400" y1="250" x2="195" y2="280" stroke="#eae5ec" stroke-width="2"/>
<line x1="400" y1="250" x2="405" y2="280" stroke="#eae5ec" stroke-width="2"/>
<line x1="270" y1="315" x2="330" y2="315" stroke="#c2a4ff" stroke-width="2"/>
<line x1="480" y1="315" x2="540" y2="315" stroke="#c2a4ff" stroke-width="2"/>
</svg>
